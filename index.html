<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>

<body>
    <header class="header">
        <div class="container header__inner">

            <a href="#" class="header__logo">
                <img src="assets/images/logo.jpeg" alt="Random Cat logo">
                <span class="header__logo-text">Random Cat</span>
            </a>

            <nav class="header__nav">
                <a href="#gallery">Gallery</a>
                <a href="#about">About</a>
                <a href="#services">Services</a>
                <a href="#contact">Contact</a>
            </nav>

        </div>
    </header>
    <main>
        <section id="hero" class="hero">
            <div class="container hero__inner">
                <div class="hero__content">
                    <h1 class="hero__title">Random Cat</h1>
                    <p class="hero__subtitle">Illustrator & Visual Artist</p>

                    <button class="hero__btn">View Gallery</button>
                </div>

                <div class="hero__visual">
                    <img class="hero__image" src="assets/images/photo_2023-12-22 16.35.42.jpeg" alt="Artwork 1">
                </div>
            </div>
        </section>

        <section id="gallery" class="gallery">
            <div class="container">

                <h2 class="gallery__title">Gallery</h2>

                <div class="gallery__grid">

                    <div class="gallery__item">
                        <img src="assets/images/photo_2023-12-22 16.35.42.jpeg" alt="Artwork 1">
                    </div>

                    <div class="gallery__item">
                        <img src="assets/images/photo_2023-12-22 16.35.42.jpeg" alt="Artwork 2">
                    </div>

                    <div class="gallery__item">
                        <img src="assets/images/photo_2023-12-22 16.35.42.jpeg" alt="Artwork 3">
                    </div>

                    <div class="gallery__item">
                        <img src="assets/images/photo_2023-12-22 16.35.42.jpeg" alt="Artwork 4">
                    </div>
                </div>
            </div>
        </section>


        <section class="about"></section>

        <section class="services"></section>

        <section class="contact"></section>
    </main>
    <footer></footer>

</body>

</html>
